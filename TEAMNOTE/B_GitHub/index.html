<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEAM NOTE</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TEAM NOTE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#b10e28">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#f8f3f3}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>

<iframe src="https://script.google.com/macros/s/AKfycbx1AZwOr6ARt-0p6y-cPRbMyYyZt4r2i2AZK2vG1WTPdvpy5jF9OfYvl5KRHbqJv1ND/exec" allow="clipboard-write"></iframe>
<script>
addEventListener('message',function(e){
 var d=e.data;if(!d||d.tn!=='id')return;
 try{if(!/googleusercontent\.com$/.test(new URL(e.origin).hostname))return}catch(x){return}
 if(d.op==='set'){try{localStorage.setItem('tn_id',JSON.stringify(d.v))}catch(x){}}
 if(d.op==='get'){var v=null;try{v=JSON.parse(localStorage.getItem('tn_id')||'null')}catch(x){}
  e.source.postMessage({tn:'id',op:'val',v:v},'*')}
});
</script>
</body>
</html>
